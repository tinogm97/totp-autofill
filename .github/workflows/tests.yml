name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests unitarios (Python)
        run: python -m unittest discover -s tests -v
      - name: Paridad de patrones JS ↔ Python
        run: node tests/url_matches_parity.mjs
      - name: Sintaxis de la extensión
        run: for f in extension/*.js; do node --check "$f"; done
