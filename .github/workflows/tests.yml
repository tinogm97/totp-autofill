name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 gir1.2-secret-1 \
            gir1.2-atspi-2.0 at-spi2-core libxtst6 libzbar0 >/dev/null
      - name: Tests unitarios
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Sintaxis de los scripts
        run: for f in get.sh install.sh uninstall.sh tests/e2e/run.sh; do bash -n "$f"; done
      - name: Instalador de principio a fin (HOME temporal)
        run: |
          export HOME="$(mktemp -d)" PATH=/usr/bin:/bin
          dbus-run-session -- bash -c '
            set -e
            ./install.sh --no-chrome
            test -x "$HOME/.local/bin/totp-autofill"
            "$HOME/.local/bin/totp-autofill" --version
            "$HOME/.local/share/totp-autofill/uninstall.sh"
            test ! -e "$HOME/.local/share/totp-autofill"'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 gir1.2-secret-1 \
            gir1.2-atspi-2.0 at-spi2-core libxtst6 xvfb dbus-x11 libzbar0 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-gtk3 gstreamer1.0-plugins-good >/dev/null
      - name: Test end-to-end (Chrome real, sesión aislada)
        run: CHROME="$(command -v google-chrome)" PATH=/usr/bin:/bin:/usr/local/bin tests/e2e/run.sh
